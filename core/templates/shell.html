<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — {{ site_name }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<body class="{{ body_class }}">
  <header class="site-header">
    <button class="nav-burger" id="nav-burger" aria-expanded="false" aria-controls="nav-drawer" aria-label="Open menu">
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
    </button>
    <a href="/" class="brand">{{ site_name }}</a>
    <span class="nav-spacer"></span>
  </header>

  <aside class="nav-drawer" id="nav-drawer" hidden aria-label="Main navigation">
    <div class="nav-drawer-head">
      <span class="nav-drawer-brand">{{ site_name }}</span>
      <button class="nav-drawer-close" id="nav-drawer-close" aria-label="Close menu">
        <i class="ph ph-x"></i>
      </button>
    </div>

    <nav class="nav-drawer-section">
      <a href="/"><i class="ph ph-house"></i><span>Home</span></a>
      <a href="/map"><i class="ph ph-map-pin"></i><span>Map</span></a>
      <a href="/value"><i class="ph ph-camera"></i><span>Identify</span></a>
    </nav>
  </aside>
  <div class="nav-backdrop" id="nav-backdrop" hidden></div>

  <main class="site-main">
    {{! content }}
  </main>

  <footer class="site-footer page-map-hide">
    <small>apparel &mdash; London clothing sourcing</small>
  </footer>

  <script src="/js/admin.js" defer></script>
  <script src="/js/nav.js" defer></script>
</body>
</html>
