<style>
.upload-zone {
  position: relative;
  border: 2px dashed var(--c-border);
  border-radius: var(--r-blob);
  padding: var(--sp-8) var(--sp-5);
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  background: var(--c-surface);
  margin-bottom: var(--sp-4);
}
.upload-zone:hover,
.upload-zone.drag-over {
  border-color: var(--c-terracotta);
  background: #FDF5F3;
}
.upload-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.upload-icon { font-size: 2.8rem; color: var(--c-muted); margin-bottom: var(--sp-2); }
.upload-zone p { margin: 0; color: var(--c-muted); font-size: 0.9rem; }
#preview-img {
  max-height: 260px;
  max-width: 100%;
  border-radius: var(--r-md);
  object-fit: contain;
}

.btn-identify {
  display: block;
  width: 100%;
  padding: var(--sp-4);
  background: var(--c-terracotta);
  color: white;
  border: none;
  border-radius: 14px 4px 14px 4px;
  font-size: 1rem;
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.01em;
  transition: opacity 0.15s;
}
.btn-identify:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-identify:not(:disabled):hover { opacity: 0.88; }

/* Result card */
.result-card {
  margin-top: var(--sp-5);
  border: 2px solid var(--c-border);
  border-radius: var(--r-blob);
  overflow: hidden;
}

/* Verdict banner — top of card, full width */
.verdict-banner {
  padding: var(--sp-4) var(--sp-5);
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: 0.01em;
}
.verdict-banner.buy  { background: #2D6A4F; color: #fff; }
.verdict-banner.maybe { background: var(--c-mustard); color: #2A2521; }
.verdict-banner.skip  { background: #C0392B; color: #fff; }

/* Body */
.result-body {
  padding: var(--sp-5);
  background: var(--c-surface);
}
.result-header { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-2); }
.result-brand  { font-size: 1.4rem; font-weight: 800; }

.tier-badge {
  display: inline-block;
  padding: 3px 14px;
  border-radius: 50px;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.tier-S { background: var(--c-terracotta); color: white; }
.tier-A { background: var(--c-sage);       color: white; }
.tier-B { background: var(--c-mustard);    color: #2A2521; }
.tier-C { background: #C8C0B5;             color: #2A2521; }
.tier-F { background: #E5DED6;             color: #7A6F67; }
.tier-unknown { background: #E5DED6;       color: #7A6F67; }

.result-meta { font-size: 0.85rem; color: var(--c-muted); margin-bottom: var(--sp-1); }
.result-value { font-size: 1rem; font-weight: 600; margin: var(--sp-3) 0 0; }
.result-notes { font-size: 0.85rem; color: var(--c-muted); margin: var(--sp-2) 0 0; }

/* Calc */
.calc-section {
  margin-top: var(--sp-5);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--c-border);
}
.calc-section h3 { margin: 0 0 var(--sp-3); font-size: 0.95rem; }
.calc-row { display: flex; gap: var(--sp-3); }
.calc-row label { flex: 1; }
.calc-row label span { display: block; font-size: 0.8rem; color: var(--c-muted); margin-bottom: 4px; }
.calc-row input {
  width: 100%;
  padding: 10px var(--sp-3);
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  font-size: 0.95rem;
  font-family: inherit;
  background: var(--c-bg);
}
.calc-output {
  margin-top: var(--sp-4);
  padding: var(--sp-4);
  border-radius: var(--r-sm);
  font-size: 0.9rem;
  line-height: 1.8;
}
.calc-output.calc-buy  { background: #EBF7F0; border: 1px solid #2D6A4F22; }
.calc-output.calc-skip { background: #FDECEA; border: 1px solid #C0392B22; }
.calc-output.calc-maybe { background: #FDF8EC; border: 1px solid var(--c-mustard); }
.calc-verdict { font-weight: 900; font-size: 1.1rem; display: block; margin-top: var(--sp-1); }
.calc-verdict.buy  { color: #2D6A4F; }
.calc-verdict.skip { color: #C0392B; }
.calc-verdict.maybe { color: #7A5C00; }

/* Always-visible kg price input */
.kgprice-row {
  margin-bottom: var(--sp-4);
}
.kgprice-row label span {
  display: block;
  font-size: 0.8rem;
  color: var(--c-muted);
  margin-bottom: 4px;
}
.kgprice-row input {
  width: 100%;
  padding: 10px var(--sp-3);
  border: 2px solid var(--c-border);
  border-radius: var(--r-sm);
  font-size: 1.1rem;
  font-family: inherit;
  font-weight: 700;
  background: var(--c-bg);
}
.err-banner {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  background: #FDECEA; border: 1px solid #C0392B44;
  border-radius: var(--r-sm); padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-4); font-size: 0.9rem; color: #7a0000;
}
.err-banner i { flex-shrink: 0; font-size: 1rem; margin-top: 2px; }
.err-banner span { flex: 1; }
.err-close {
  background: none; border: none; cursor: pointer; color: #7a0000;
  font-size: 1rem; padding: 0; line-height: 1; flex-shrink: 0;
}

@media (max-width: 500px) {
  .calc-row { flex-direction: column; }
  .result-header { flex-direction: column; gap: var(--sp-1); }
}
</style>

<h1>Identify</h1>
<p class="lede">Enter the shop's price per kg, then photo a label or tag.</p>

<div id="err" class="err-banner" style="display:none">
  <i class="ph ph-warning"></i>
  <span id="err-msg"></span>
  <button class="err-close" onclick="document.getElementById('err').style.display='none'"><i class="ph ph-x"></i></button>
</div>

<div class="kgprice-row">
  <label>
    <span>Shop price per kg (£)</span>
    <input type="number" id="calc-kgprice" placeholder="e.g. 15" min="0.01" step="0.5">
  </label>
</div>

<div class="upload-zone" id="upload-zone">
  <input type="file" id="file-input" accept="image/*" capture="environment">
  <div id="upload-prompt">
    <div class="upload-icon"><i class="ph ph-camera"></i></div>
    <p>Tap to take a photo, or drag and drop an image</p>
  </div>
  <img id="preview-img" style="display:none" alt="Preview">
</div>

<button class="btn-identify" id="btn-identify" disabled>Identify brand</button>

<div id="progress-wrap" style="display:none;margin:var(--sp-3) 0">
  <div style="height:4px;background:var(--c-border);border-radius:2px;overflow:hidden">
    <div id="progress-bar" style="height:100%;background:var(--c-terracotta);width:0%;transition:width 0.4s ease"></div>
  </div>
  <div id="progress-label" style="font-size:0.8rem;color:var(--c-muted);margin-top:5px"></div>
</div>

<div class="result-card" id="result-card" style="display:none">
  <div class="verdict-banner" id="verdict-banner"></div>
  <div class="result-body">
    <div class="result-header">
      <span class="result-brand" id="result-brand"></span>
      <span class="tier-badge" id="tier-badge"></span>
    </div>
    <p class="result-meta" id="result-meta"></p>
    <p class="result-value" id="result-value"></p>
    <p class="result-notes" id="result-notes"></p>

    <div class="calc-section" id="calc-section" style="display:none">
      <div class="calc-row">
        <label>
          <span>Item weight (g)</span>
          <input type="number" id="calc-weight" placeholder="e.g. 400" min="1">
        </label>
      </div>
      <div class="calc-output" id="calc-output" style="display:none"></div>
    </div>
  </div>
</div>

<script>
const zone         = document.getElementById('upload-zone');
const fileInput    = document.getElementById('file-input');
const previewImg   = document.getElementById('preview-img');
const uploadPrompt = document.getElementById('upload-prompt');
const btnIdentify  = document.getElementById('btn-identify');
const resultCard   = document.getElementById('result-card');

let selectedFile = null;
let currentMin = null, currentMax = null, currentTier = null;

const TIER_VERDICT = {
  S: { cls: 'buy',   text: 'Defo buy — top shelf brand' },
  A: { cls: 'buy',   text: 'Good find — worth it' },
  B: { cls: 'maybe', text: 'Maybe — depends on price' },
  C: { cls: 'maybe', text: 'Iffy — low margin brand' },
  F: { cls: 'skip',  text: "Don't bother — not worth reselling" },
};

zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) setFile(f);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) setFile(fileInput.files[0]);
});

function setFile(f) {
  selectedFile = f;
  previewImg.src = URL.createObjectURL(f);
  previewImg.style.display = 'block';
  uploadPrompt.style.display = 'none';
  btnIdentify.disabled = false;
  resultCard.style.display = 'none';
}

function showErr(msg) {
  const el = document.getElementById('err');
  document.getElementById('err-msg').textContent = msg;
  el.style.display = 'flex';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 6000);
}

const progressWrap = document.getElementById('progress-wrap');
const progressBar  = document.getElementById('progress-bar');
const progressLabel = document.getElementById('progress-label');
let progressTimer = null;

function setProgress(pct, label) {
  progressBar.style.width = pct + '%';
  if (label) progressLabel.textContent = label;
}

function startProgress() {
  progressWrap.style.display = '';
  setProgress(0, 'Scanning...');
  setTimeout(() => setProgress(25, 'Scanning...'), 50);
  setTimeout(() => setProgress(55, 'Identifying brand...'), 800);
  setTimeout(() => setProgress(75, 'Estimating value...'), 2200);
  setTimeout(() => setProgress(88, 'Almost done...'), 4000);
}

function finishProgress() {
  setProgress(100, '');
  setTimeout(() => { progressWrap.style.display = 'none'; setProgress(0, ''); }, 400);
}

btnIdentify.addEventListener('click', async () => {
  if (!selectedFile) return;
  btnIdentify.disabled = true;
  btnIdentify.textContent = 'Identifying...';
  resultCard.style.display = 'none';
  currentMin = currentMax = currentTier = null;

  startProgress();
  const form = new FormData();
  form.append('image', selectedFile);

  try {
    const resp = await fetch('/api/value/identify', { method: 'POST', body: form });
    finishProgress();
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }
    const d = await resp.json();

    // Verdict banner
    const banner = document.getElementById('verdict-banner');
    currentTier = d.tier;
    if (d.tier && TIER_VERDICT[d.tier]) {
      const v = TIER_VERDICT[d.tier];
      banner.textContent = v.text;
      banner.className = `verdict-banner ${v.cls}`;
      banner.style.display = '';
    } else {
      banner.style.display = 'none';
    }

    // Brand + tier badge
    document.getElementById('result-brand').textContent = d.brand || (d.item_type ? `Unbranded ${d.item_type}` : 'Unknown item');
    const badge = document.getElementById('tier-badge');
    if (d.tier) {
      badge.textContent = d.tier;
      badge.className = `tier-badge tier-${d.tier}`;
    } else {
      badge.textContent = '?';
      badge.className = 'tier-badge tier-unknown';
    }

    // Meta line: item type + confidence
    const metaParts = [];
    if (d.item_type) metaParts.push(d.item_type);
    if (d.confidence) metaParts.push(`${d.confidence} confidence`);
    document.getElementById('result-meta').textContent = metaParts.join(' · ');

    // Price
    if (d.min_value_gbp != null && d.max_value_gbp != null) {
      const sourceLabel = d.price_source === 'ebay+ai' ? ' · eBay+AI'
                        : d.price_source === 'ai'      ? ' · AI estimate'
                        : d.price_source === 'database' ? ' · database'
                        : '';
      document.getElementById('result-value').textContent =
        `Est. Depop resale £${d.min_value_gbp}–£${d.max_value_gbp}${sourceLabel}`;
      currentMin = d.min_value_gbp;
      currentMax = d.max_value_gbp;
      document.getElementById('calc-section').style.display = 'block';

      // Pre-fill weight if estimated
      if (d.estimated_weight_g) {
        document.getElementById('calc-weight').value = d.estimated_weight_g;
      }
    } else {
      document.getElementById('result-value').textContent = '';
      document.getElementById('calc-section').style.display = 'none';
    }

    const notesEl = document.getElementById('result-notes');
    const notes = d.brand_notes || (d.brand ? '' : d.notes || '');
    notesEl.textContent = notes;
    notesEl.style.display = notes ? '' : 'none';

    resultCard.style.display = 'block';
    updateCalc();
  } catch (e) {
    finishProgress();
    showErr(e.message);
  } finally {
    btnIdentify.disabled = false;
    btnIdentify.textContent = 'Identify brand';
  }
});

function updateCalc() {
  if (currentMin == null) return;
  const w  = parseFloat(document.getElementById('calc-weight').value);
  const kp = parseFloat(document.getElementById('calc-kgprice').value);
  const out = document.getElementById('calc-output');
  if (!w || !kp) { out.style.display = 'none'; return; }

  const buyCost    = (w / 1000) * kp;
  const marginLow  = currentMin - buyCost;
  const marginHigh = currentMax - buyCost;
  const roi        = marginLow / buyCost;

  let verdict, cls;
  if (roi >= 1.5) {
    verdict = 'Defo buy — great margin'; cls = 'buy';
  } else if (roi >= 0.5) {
    verdict = 'Worth it — decent margin'; cls = 'buy';
  } else if (roi >= 0) {
    verdict = 'Marginal — slim profit'; cls = 'maybe';
  } else {
    verdict = "Don't buy — margin too thin"; cls = 'skip';
  }

  out.className = `calc-output calc-${cls}`;
  out.innerHTML = `
    Buy cost: <strong>£${buyCost.toFixed(2)}</strong> &nbsp;·&nbsp;
    Est. resale: <strong>£${currentMin}–£${currentMax}</strong> &nbsp;·&nbsp;
    Margin: <strong>£${marginLow.toFixed(0)}–£${marginHigh.toFixed(0)}</strong>
    <span class="calc-verdict ${cls}">${verdict}</span>
  `;
  out.style.display = 'block';
}

document.getElementById('calc-weight').addEventListener('input', updateCalc);
document.getElementById('calc-kgprice').addEventListener('input', updateCalc);
// re-run calc if kg price was already set when result arrives
document.getElementById('calc-kgprice').addEventListener('change', updateCalc);
</script>
