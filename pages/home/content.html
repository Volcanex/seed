<style>
.tool-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-4);
  margin-top: var(--sp-6);
}
@media (max-width: 500px) { .tool-grid { grid-template-columns: 1fr; } }

.tool-card {
  display: block;
  padding: var(--sp-6) var(--sp-5);
  background: var(--c-surface);
  border: 2px solid var(--c-border);
  border-radius: var(--r-blob);
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.tool-card:hover {
  border-color: var(--c-terracotta);
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(196,97,74,0.12);
  text-decoration: none;
}
.tool-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px 4px 12px 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: var(--sp-4);
  color: white;
}
.tool-icon.t { background: var(--c-terracotta); }
.tool-icon.s { background: var(--c-sage); }

.tool-card h2 { margin: 0 0 var(--sp-2); font-size: 1.1rem; }
.tool-card p  { margin: 0; font-size: 0.9rem; color: var(--c-muted); line-height: 1.45; }
</style>

<h1>Nina's apparel center &#9829;</h1>
<p class="lede">Hello Nina my lovely girlfriend, these tools will help you with your empire. I love you x</p>

<div class="tool-grid">
  <a href="/map" class="tool-card">
    <div class="tool-icon t"><i class="ph ph-map-pin"></i></div>
    <h2>London Map</h2>
    <p>KG sale shops, car boots, and fabric wholesale — with prices and opening hours.</p>
  </a>
  <a href="/value" class="tool-card">
    <div class="tool-icon s"><i class="ph ph-camera"></i></div>
    <h2>Brand Identifier</h2>
    <p>Photo a label or logo. Get the brand tier and estimated resale value.</p>
  </a>
</div>
